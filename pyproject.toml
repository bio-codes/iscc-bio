[project]
name = "iscc-bio"
version = "0.1.0"
description = "BioCodes - ISCC Processing for BioImaging Data"
authors = [{ name = "Titusz", email = "tp@iscc.io" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "iscc",
    "bioimage",
    "bioimaging",
    "identifier",
    "hash",
    "imagewalk",
    "ome",
    "microscopy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "iscc-lib",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "click>=8.0.0",
    "ome-zarr>=0.12.2",
    "bioio>=3.0.0",
    "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://bio.iscc.codes"
Repository = "https://github.com/bio-codes/iscc-bio"
Documentation = "https://bio.iscc.codes"
Issues = "https://github.com/bio-codes/iscc-bio/issues"


[project.optional-dependencies]
# Individual BioIO reader plugins
bioformats = ["bioio-bioformats>=1.3.0"]
czi = ["bioio-czi>=2.4.0"]
ome-tiff = ["bioio-ome-tiff>=1.4.0"]
ome-zarr-plugin = ["bioio-ome-zarr>=2.3.0"]
dv = ["bioio-dv>=1.2.0"]
imageio = ["bioio-imageio>=1.3.0"]
lif = ["bioio-lif>=1.4.1"]
nd2 = ["bioio-nd2>=1.5.0"]
tifffile = ["bioio-tifffile>=1.3.0"]
tiff-glob = ["bioio-tiff-glob>=1.2.0"]

# All BioIO readers (bioformats first for priority)
readers = [
    "bioio-bioformats>=1.3.0",
    "bioio-czi>=2.4.0",
    "bioio-ome-tiff>=1.4.0",
    "bioio-ome-zarr>=2.3.0",
    "bioio-dv>=1.2.0",
    "bioio-imageio>=1.3.0",
    "bioio-lif>=1.4.1",
    "bioio-nd2>=1.5.0",
    "bioio-tifffile>=1.3.0",
    "bioio-tiff-glob>=1.2.0",
]

# All BioIO readers (convenience alias for `readers`)
all = ["iscc-bio[readers]"]

[dependency-groups]
dev = [
    "poethepoet>=0.25.0",
    "pre-commit>=2.20.0",
    "mkdocs-material>=9.6.14",
    "mkdocs-glightbox>=0.4.0",
    "mdformat>=0.7.22",
    "mdformat-mkdocs>=4.3.0",
    "mdformat-footnote>=0.1.1",
    "mdformat-tables>=1.0.0",
    "mdformat-gfm-alerts>=2.0.0",
    "pytest>=8.4.2",
]

[project.scripts]
iscc-bio = "iscc_bio.cli:cli"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iscc_bio*"]

[tool.uv]
package = true

[tool.ruff]
# Support for PEP 484 type comments
extend-exclude = []

[tool.ruff.lint]
# Allow imports that are only used in type comments
# See: https://docs.astral.sh/ruff/settings/#lint_typing-modules
typing-modules = ["typing"]

[tool.ruff.lint.per-file-ignores]
# Files using type comments need to keep their typing imports
"**/imagewalk/*.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.poe.tasks]
# Documentation tasks
docs-build = { script = "scripts.build_docs:main", help = "Copy README.md to /docs" }
# Fromatting
format-md = { shell = "uv run mdformat --end-of-line lf --wrap 112 --number *.md docs", help = "Format markdown files" }
format-code = { shell = "uv run ruff format .", help = "Format code files" }
format = { sequence = ["format-code", "format-md"], help = "Format all files" }
# All-in-one command
all = ["docs-build", "format"]
